name: tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 显式 bash 启用 pipefail，避免 tee 把失败测试伪装成成功。
defaults:
  run:
    shell: bash

jobs:
  regression:
    name: 后端、前端和完整冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_FULL_SMOKE: '1'
      PYTHONUNBUFFERED: '1'
      # v6.7.4：server 启动会在后台预热「宿主直连上行基线」。CI 不需要这个读数，
      # 而每个 import server 的测试进程都会各测一次（MB 级直连流量），统一关掉。
      # tools/test_uplink.py 内部会自己把它打开来测基线逻辑。
      UPLINK_BASELINE_KBPS: '-1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt tzdata
          npm ci --ignore-scripts
      - name: 审核交错回归（后端）
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          python tools/test_audit_backend.py 2>&1 | tee artifacts/audit-backend.log
      - name: 审核交错回归（前端）
        if: ${{ !cancelled() }}
        run: node tools/test_audit_frontend.js 2>&1 | tee artifacts/audit-frontend.log
      - name: 发现公平性回归
        if: ${{ !cancelled() }}
        run: python tools/test_discovery_fairness.py 2>&1 | tee artifacts/discovery-fairness.log
      - name: 并发利用率、补量和恢复回归
        if: ${{ !cancelled() }}
        run: python tools/test_maintenance_pipeline.py 2>&1 | tee artifacts/maintenance-pipeline.log
      - name: 语法与前端回归
        run: |
          mkdir -p artifacts
          python -m py_compile server.py proxy_check.py repository.py maintenance.py tools/test_maintenance_pipeline.py tools/test_workspace.py tools/smoke.py tools/test_uplink.py
          node --check app.js
          node tools/test_workspace_frontend.js 2>&1 | tee artifacts/frontend.log
          node tools/test_result_performance.js 2>&1 | tee artifacts/result-performance.log
          node tools/test_auto_loading.js 2>&1 | tee artifacts/auto-loading.log
          node tools/test_maintenance_frontend.js 2>&1 | tee artifacts/maintenance-frontend.log
          node tools/test_frontend_pipeline.js 2>&1 | tee artifacts/frontend-pipeline.log
          node tools/test_cache_dom.js 2>&1 | tee artifacts/cache-dom.log
          python tools/test_performance_api.py 2>&1 | tee artifacts/performance-api.log
      - name: 仓库策略和 Z.AI 回归
        run: |
          python tools/test_maintenance.py 2>&1 | tee artifacts/maintenance.log
          python tools/test_maintenance_api.py 2>&1 | tee artifacts/maintenance-api.log
          python tools/test_repo_policy.py 2>&1 | tee artifacts/repo-policy.log
          python tools/test_zai_profile.py 2>&1 | tee artifacts/zai-profile.log
      - name: 上行吞吐测速回归
        run: python tools/test_uplink.py 2>&1 | tee artifacts/uplink.log
      - name: 固定身份、重启持久化及两种模式完整冒烟
        run: python tools/test_workspace.py 2>&1 | tee artifacts/workspace.log
      - name: 保存测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: artifacts/

  container:
    name: Docker 冒烟（${{ matrix.mode }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [isolated, fixed]
    env:
      WORKSPACE_TOKEN: ${{ matrix.mode == 'fixed' && 'user_ci_fixed' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 验证 Compose 基线总超时透传
        run: |
          for value in 0 7; do
            UPLINK_BASELINE_TOTAL_SECONDS="$value" docker compose --env-file .env.example config --format json > /tmp/proxy-checker-compose.json
            python -c 'import json, sys; config = json.load(open("/tmp/proxy-checker-compose.json")); assert str(config["services"]["proxy-checker"]["environment"]["UPLINK_BASELINE_TOTAL_SECONDS"]) == sys.argv[1]' "$value"
          done
      - uses: docker/setup-buildx-action@v3
      - name: 构建待测试镜像（不发布）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: proxy-checker:ci
          cache-from: type=gha,scope=smoke-${{ matrix.mode }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.mode }}
      - name: 启动真实容器
        run: |
          docker run -d --name proxy-checker-smoke \
            -p 127.0.0.1:8888:8888 \
            -e AUTH_PASSWORD=ci-smoke-password \
            -e WORKSPACE_TOKEN="$WORKSPACE_TOKEN" \
            proxy-checker:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8888/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: 完整容器冒烟测试
        run: |
          mkdir -p artifacts
          python tools/smoke.py --base-url http://127.0.0.1:8888 \
            --password ci-smoke-password --expected-workspace-token "$WORKSPACE_TOKEN" \
            2>&1 | tee artifacts/smoke.log
      - name: 收集容器日志
        if: always()
        run: |
          mkdir -p artifacts
          docker logs proxy-checker-smoke >artifacts/container.log 2>&1 || true
          docker rm -f proxy-checker-smoke || true
      - name: 保存容器测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs-${{ matrix.mode }}
          path: artifacts/
